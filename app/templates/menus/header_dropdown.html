{% if menu_items %}
    <ul class="dropdown-menu tw-rounded-none tw-border-2 tw-border-black small-text">
        {% for item in menu_items %}
            <li>
                <a href="{{ item.href }}"
                   class="dropdown-item text-uppercase tw-text-sm {{ item.active_class }}">{{ item.text }}</a>
            </li>
        {% endfor %}
    </ul>
{% endif %}
